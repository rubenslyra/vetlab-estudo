<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página não encontrada | VET-Lab</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#202024">
<link rel="icon" type="image/svg+xml" href="/vetlab-estudo/assets/favicon.svg">
<style>
  html { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background:
      radial-gradient(circle at 15% 10%, rgba(196, 112, 70, 0.16), transparent 45%),
      radial-gradient(circle at 85% 85%, rgba(123, 168, 184, 0.14), transparent 50%),
      #202024;
    color: #e8e5df;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  main { max-width: 620px; text-align: center; }
  .brand {
    margin: 0 0 24px;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    color: #b9b4aa;
  }
  .brand span { color: #c47046; }
  .code {
    margin: 0;
    font-family: "Consolas", ui-monospace, monospace;
    font-size: clamp(84px, 20vw, 150px);
    font-weight: 700;
    line-height: 0.9;
    background: linear-gradient(120deg, #c47046, #7ba8b8);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }
  h1 { margin: 20px 0 12px; font-size: clamp(24px, 4vw, 34px); }
  .message {
    max-width: 46ch;
    margin: 0 auto;
    color: #b9b4aa;
    line-height: 1.65;
  }
  .actions {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    justify-content: center;
    margin-top: 32px;
  }
  .actions a {
    display: inline-block;
    padding: 12px 22px;
    border: 1px solid rgba(196, 112, 70, 0.55);
    border-radius: 8px;
    color: #e8e5df;
    font-size: 15px;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.2s, border-color 0.2s;
  }
  .actions a:hover { background: rgba(196, 112, 70, 0.16); border-color: #c47046; }
  .actions a.primary { background: #c47046; border-color: #c47046; color: #1a1a1e; }
  .actions a.primary:hover { background: #d48056; }
  footer { margin-top: 36px; font-size: 13px; color: #8f8a80; }
</style>
</head>
<body>
<main>
  <p class="brand">VET<span>-Lab</span></p>
  <p class="code">404</p>
  <h1>Página não encontrada</h1>
  <p class="message">
    O endereço que você tentou abrir não existe ou foi movido.
    Volte ao caso de estudo ou siga para a documentação técnica.
  </p>
  <div class="actions">
    <a class="primary" href="/vetlab-estudo/">Caso de estudo</a>
    <a href="/vetlab-estudo/docs-request/">Documentação técnica</a>
  </div>
  <footer>Plataforma VET-Lab · Gestão de exames veterinários</footer>
</main>
</body>
</html>
